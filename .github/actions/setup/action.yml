name: Setup
description: Checkout code and setup requirements for CI/CD pipelines
runs:
  using: composite
  steps:
    - name: Instal Node.js (LTS)
      uses: actions/setup-node@v4                   # https://github.com/actions/setup-node
      with:
        node-version: 'lts/*'
    - name: Set up Python 3
      uses: actions/setup-python@v7                 # https://github.com/actions/setup-python
      with:
        python-version: 3.x
    - name: Install Task (taskfile.dev)
      uses: devpro/github-workflow-parts/actions/task/setup@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
    - name: Install required CLIs
      run: task setup
      shell: bash
