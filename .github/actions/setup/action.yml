name: Setup
description: Checkout code and setup requirements for CI/CD pipelines
runs:
  using: composite
  steps:
    - name: Instal Node.js (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
    - name: Install Task (taskfile.dev)
      uses: devpro/github-workflow-parts/actions/task/setup@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
    - name: Prepare the install locations
      run: |
        python3 -m venv "${RUNNER_TEMP}/venv"
        echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
        echo "NPM_CONFIG_PREFIX=${RUNNER_TEMP}/npm" >> "$GITHUB_ENV"
        echo "${RUNNER_TEMP}/npm/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: Install required CLIs
      run: task setup
      shell: bash
