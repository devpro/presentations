name: Setup
description: Checkout code and setup requirements for CI/CD pipelines
runs:
  using: composite
  steps:
    - name: Instal Node.js (LTS)
      uses: actions/setup-node@v4                   # https://github.com/actions/setup-node
      with:
        node-version: 'lts/*'
    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Install Task (taskfile.dev)
      # Downloaded from its release with the checksum verified, into a directory the job owns, so that neither a third party action nor sudo is needed.
      run: |
        TASK_VERSION=3.54.0
        BASE_URL="https://github.com/go-task/task/releases/download/v${TASK_VERSION}"
        cd "$(mktemp -d)"
        curl -sSL -O "${BASE_URL}/task_linux_amd64.tar.gz"
        curl -sSL -O "${BASE_URL}/task_checksums.txt"
        grep " task_linux_amd64.tar.gz$" task_checksums.txt | sha256sum --check --status
        mkdir -p "${RUNNER_TEMP}/bin"
        tar -xzf task_linux_amd64.tar.gz -C "${RUNNER_TEMP}/bin" task
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: Prepare the install locations
      # A runner image can own neither /usr/local nor the system Python, so global npm packages and pip packages go to the temporary directory.
      run: |
        python3 -m venv "${RUNNER_TEMP}/venv"
        echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
        echo "NPM_CONFIG_PREFIX=${RUNNER_TEMP}/npm" >> "$GITHUB_ENV"
        echo "${RUNNER_TEMP}/npm/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: Install required CLIs
      run: task setup
      shell: bash
