name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@398cf79719f90e41e3407bc9f060e297629d800d

  build:
    name: Build
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@398cf79719f90e41e3407bc9f060e297629d800d
    with:
      # The Python tools go in a virtual environment of the run, which a runner without root can write.
      build-command: |
        python3 -m venv "${RUNNER_TEMP}/venv"
        export PATH="${RUNNER_TEMP}/venv/bin:$PATH"
        task setup
        task build
      deploy: false
      site-path: dist
      task-enabled: true
      workflow-parts-version: 398cf79719f90e41e3407bc9f060e297629d800d

  code-quality:
    name: Code
    # Without a Sonar project there is nothing to analyse against.
    if: vars.SONAR_PROJECT_KEY != ''
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@398cf79719f90e41e3407bc9f060e297629d800d
    with:
      sonar-enabled: true
      # The exports are generated files.
      sonar-exclusions: "**/node_modules/**,exports/**"
      sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      sonar-organization: ${{ vars.SONAR_ORG }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      sonar-project-name: presentations
      workflow-parts-version: 398cf79719f90e41e3407bc9f060e297629d800d
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
