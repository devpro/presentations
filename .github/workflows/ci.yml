name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@bbf341ec77510dacdfbb04ca5af7947dd8f6fb47

  build:
    name: Build
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@bbf341ec77510dacdfbb04ca5af7947dd8f6fb47
    with:
      # The command line tools go in a virtual environment and an npm prefix of the run, which a runner without root can write.
      build-command: |
        python3 -m venv "${RUNNER_TEMP}/venv"
        export NPM_CONFIG_PREFIX="${RUNNER_TEMP}/npm"
        export PATH="${RUNNER_TEMP}/venv/bin:${RUNNER_TEMP}/npm/bin:$PATH"
        task setup
        task build
      deploy: false
      site-path: dist
      task-enabled: true
      workflow-parts-version: bbf341ec77510dacdfbb04ca5af7947dd8f6fb47
