name: Deploy                                          # Continuously Deployment

on:
  push:
    branches:
      - "main"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@8c856cd16adc8a0ca01c7889a9c7d98ad8593818
    with:
      # The Python tools go in a virtual environment of the run, which a runner without root can write.
      build-command: |
        python3 -m venv "${RUNNER_TEMP}/venv"
        export PATH="${RUNNER_TEMP}/venv/bin:$PATH"
        task setup
        task build
      site-path: dist
      task-enabled: true
      workflow-parts-version: 8c856cd16adc8a0ca01c7889a9c7d98ad8593818
