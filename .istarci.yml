runner:
  sonarqube:
    gate: true
    profile: Sonar way comprehensive
    projects:
      - presentations

workflow:
  onDisallowedAction: fail
  allowedActions:
    - actions/*
    - github/*
    - docker/*
    - devpro/github-workflow-parts/*
  exclude:
    - deploy.yml

vars:
  SONAR_ORG: local
  SONAR_PROJECT_KEY: presentations
